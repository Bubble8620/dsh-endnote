name: Publish to npm

# Trusted publishing (GitHub OIDC) — no npm token is stored anywhere.
#
# The `id-token: write` permission below is the load-bearing line: it lets the
# job mint the short-lived OIDC token that `npm publish` exchanges for publish
# rights. Without it npm falls back to looking for a token and fails ENEEDAUTH.
#
# This exists because the account has 2FA enforced and a granular access token
# without "bypass 2FA" cannot publish (verified: HTTP 403, bypass_2fa=false).
# OIDC sidesteps tokens entirely.
#
# npm-side configuration this must match EXACTLY (package settings -> Trusted
# Publisher -> GitHub Actions):
#     Organization or user : Bubble8620
#     Repository           : dsh-endnote
#     Workflow filename    : publish.yml      <-- filename only, not the path
#     Allowed actions      : npm publish
#
# Release flow: bump `version` in package.json, commit, then push a matching
# tag (e.g. v1.0.1). The tag guard below keeps an ordinary push to main from
# publishing.

on:
  push:
    tags:
      - 'v*'
  # Manual escape hatch: re-run a failed publish without creating a new tag.
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC; without it the exchange cannot happen
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Caching is deliberately off for a release build: a stale cache could
          # publish a tarball that does not match the tagged commit.
          package-manager-cache: false

      # The tag and package.json must agree, or the tarball would not match the
      # tag it is published under. Checked before anything is published.
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package.json: $pkg_version   tag: $tag_version"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package.json version ($pkg_version) != tag ($tag_version)"
            exit 1
          fi

      # The package ships no node_modules of its own; the @deepseek-ai peers are
      # optional and resolved at runtime by the harness, so there is nothing to
      # `npm ci` here. Install nothing and run the repo's own checks.

      - name: Run the test suite
        run: |
          set -euo pipefail
          node tools/smoke_test.mjs
          node tools/validate_patch.mjs
          python3 tools/test_imports.py
          python3 tools/check_skills.py skills

      - name: Verify the tarball contents
        run: |
          set -euo pipefail
          # Exit codes are a contract here: 0 = verified against `npm pack`,
          # 1 = something that must not ship is present, 2 = ran but npm was
          # unavailable so the file list was approximated. Only 1 is a failure.
          # npm is present on this runner (setup-node installed it), so 0 is
          # expected; tolerating 2 keeps a runner quirk from reading as a leak.
          set +e
          python3 tools/verify_package.py
          code=$?
          set -e
          case "$code" in
            0) echo "verified against the real npm packing list" ;;
            2) echo "::warning::verify_package approximated the file list (npm unavailable)" ;;
            *) echo "::error::verify_package failed with exit $code"; exit "$code" ;;
          esac

      - name: Publish
        run: npm publish --access public
